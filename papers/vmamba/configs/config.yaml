# FCS-VMamba experiment configuration — paper-faithful lightweight model
# ~1.2M params (J. Imaging 2026, Table 3): fixed 96-d channels, depths [2,2,2,2]
# Trained on WM-811K (9 classes). Compatible with FCSVMamba.from_config()
# and common.engine.EngineConfig.

model:
  name: fcs_vmamba
  num_classes: 9
  task: classification

  backbone:
    name: fcs_vmamba
    pretrained: false
    embed_dim: 96
    depths: [2, 2, 2, 2]
    num_heads: [3, 6, 12, 24]   # legacy; CLCA uses clca.num_heads
    ssm_ratio: 2.0
    mlp_ratio: 4.0              # unused (FSSLayer has no MLP)
    drop_path_rate: 0.1
    d_state: 16
    fixed_channels: true        # paper: no channel doubling on merge

  fa:
    enabled: true
    reduction: 16

  sfs:
    enabled: true
    suppression_ratio: 0.2      # α in Eq. (5)
    suppression_radius: 1       # R in Eq. (5)
    reduction: 4                # unused (SFS is parameter-free)

  clca:
    enabled: true
    num_heads: 4
    reduction: 16               # unused (true cross-attention)

  input:
    image_size: 224
    channels: 3

data:
  dataset: wafer_defects
  data_root: datasets/wm811k
  image_size: 224
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1

training:
  num_classes: 9
  batch_size: 4                 # paper Sec. 4.1
  num_epochs: 50                # paper Sec. 4.1
  learning_rate: 0.001          # paper Sec. 4.1 (AdamW)
  weight_decay: 0.05
  device: cuda
  amp: false
  grad_max_norm: 1.0

optimizer:
  name: adamw
  lr: 0.001
  weight_decay: 0.05

scheduler:
  name: cosine
  kwargs:
    T_max: 50

loss:
  name: cross_entropy

metrics:
  - accuracy
  - f1
  - recall
  - precision

evaluation:
  batch_size: 32
  metrics:
    - accuracy
    - f1
    - recall
    - precision

logging:
  level: INFO
  save_checkpoints: true
  checkpoint_interval: 10

checkpoint:
  save_dir: checkpoints/vmamba_wm811k
  metric_name: val_loss
  mode: min

dataset:
  name: wafer_defects
  image_size: 224
  num_classes: 9
