# FCS-VMamba experiment configuration — VMamba-Nano
# Reduced model size for 8GB VRAM (was 46.6M params, now ~3-5M)
# Trained on WM-811K wafer map dataset (9 classes)
# Compatible with both FCSVMamba.from_config() and common.engine.EngineConfig.

model:
  name: fcs_vmamba
  num_classes: 9
  task: classification

  backbone:
    name: vmamba_nano
    pretrained: false
    embed_dim: 48            # was 96 — базовая размерность уменьшена в 2 раза
    depths: [1, 1, 3, 1]     # was [2, 2, 6, 2] — всего 6 блоков вместо 12
    num_heads: [2, 4, 8, 16] # was [3, 6, 12, 24] — меньше голов внимания
    ssm_ratio: 1.0           # was 2.0 — меньше SSM hidden state
    mlp_ratio: 2.0           # was 4.0 — меньше MLP hidden dim
    drop_path_rate: 0.1      # was 0.2 — меньше dropout для маленькой модели

  fa:
    enabled: false           # FFT даёт ComplexHalf -> NaN в AMP, отключено
    reduction: 8
    fft_norm: ortho

  sfs:
    enabled: true
    reduction: 4

  clca:
    enabled: true
    reduction: 8             # was 16 — больше сжатие для маленькой модели

  input:
    image_size: 128
    channels: 3

data:
  dataset: wafer_defects
  data_root: datasets/wm811k
  image_size: 128
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1

training:
  num_classes: 9
  batch_size: 64
  num_epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.05
  device: cuda
  amp: false                # pure-PyTorch SS2D медленнее в AMP из-за кастов
  grad_max_norm: 1.0

# Engine-compatible optimizer config (top-level, as expected by Builder)
optimizer:
  name: adamw
  lr: 0.0001                # синхронизировано с training.learning_rate
  weight_decay: 0.05

# Engine-compatible scheduler config (top-level, as expected by Builder)
scheduler:
  name: cosine
  kwargs:
    T_max: 100               # was 50 — синхронизировано с num_epochs

# Engine-compatible loss config (top-level, as expected by Builder)
loss:
  name: cross_entropy

# Engine-compatible metrics list (top-level, as expected by Builder)
metrics:
  - accuracy
  - f1
  - recall
  - precision

evaluation:
  batch_size: 128
  metrics:
    - accuracy
    - f1
    - recall
    - precision

logging:
  level: INFO
  save_checkpoints: true
  checkpoint_interval: 10    # was 5 — реже, т.к. эпох больше

checkpoint:
  save_dir: checkpoints/vmamba_wm811k
  metric_name: val_loss
  mode: min

# Engine-compatible dataset section
dataset:
  name: wafer_defects
  image_size: 128            # was 224 — исправлено, т.к. данные 128x128
  num_classes: 9
