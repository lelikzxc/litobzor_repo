# FCS-VMamba — locked Subset A baseline (best local result so far)
#
# Achieved (50 ep, seed-dependent): Top-1 ~73.9% / Macro-F1 ~72.9%
# Paper target: Top-1 87.91% / Macro-F1 86.06% — gap still open; do not
# casually change encoding / CLCA stages / init without a controlled ablations.
#
# Locked recipe:
#   - Input: die one-hot {0,1,2} → 3ch, bilinear → 224 (NOT /255 grayscale)
#   - Model: ~1.01M params, CLCA on last stage only, SS2D forward_type=v03
#   - Head: GAP → LayerNorm → Linear
#   - Train: batch=4, AdamW lr=1e-3, wd=0.05, cosine 50 ep, grad_max_norm=1.0
#   - Aug: H/V flip + RandomAffine(15°, translate 0.1, NEAREST); no color jitter
# Requires selective_scan_cuda_oflex in the venv.

model:
  name: fcs_vmamba
  num_classes: 9
  task: classification

  backbone:
    name: fcs_vmamba
    pretrained: false
    embed_dim: 96
    depths: [2, 2, 2, 2]
    num_heads: [3, 6, 12, 24]
    ssm_ratio: 2.0
    mlp_ratio: 4.0
    drop_path_rate: 0.1
    d_state: 16
    fixed_channels: true

  fa:
    enabled: true
    reduction: 16

  sfs:
    enabled: true
    suppression_ratio: 0.2
    suppression_radius: 1
    reduction: 4

  clca:
    enabled: true
    num_heads: 4
    reduction: 16

  input:
    image_size: 224
    channels: 3

data:
  dataset: wafer_defects
  data_root: datasets/wm811k
  image_size: 224
  train_split: 0.8
  val_split: 0.2
  test_split: 0.0

training:
  num_classes: 9
  batch_size: 4
  num_epochs: 50
  learning_rate: 0.001
  weight_decay: 0.05
  device: cuda
  amp: false
  grad_max_norm: 1.0
  grad_max_value: null

optimizer:
  name: adamw
  lr: 0.001
  weight_decay: 0.05

scheduler:
  name: cosine
  kwargs:
    T_max: 50

loss:
  name: cross_entropy

metrics:
  - accuracy
  - f1
  - recall
  - precision

evaluation:
  batch_size: 16
  metrics:
    - accuracy
    - f1
    - recall
    - precision

logging:
  level: INFO
  save_checkpoints: true
  checkpoint_interval: 10

checkpoint:
  save_dir: checkpoints/vmamba_wm811k
  metric_name: val_accuracy
  mode: max

dataset:
  name: wafer_defects
  image_size: 224
  num_classes: 9
