# FCS-VMamba experiment configuration
# Compatible with both FCSVMamba.from_config() and common.engine.EngineConfig.

model:
  name: fcs_vmamba
  num_classes: 8
  task: classification

  backbone:
    name: vmamba_tiny
    pretrained: false
    embed_dim: 96
    depths: [2, 2, 6, 2]
    num_heads: [3, 6, 12, 24]
    ssm_ratio: 2.0
    mlp_ratio: 4.0
    drop_path_rate: 0.2

  fa:
    enabled: true
    reduction: 16
    fft_norm: ortho

  sfs:
    enabled: true
    reduction: 4

  clca:
    enabled: true
    reduction: 16

  input:
    image_size: 224
    channels: 3

data:
  dataset: wafer_defects
  image_size: 224
  num_classes: 8
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1

training:
  num_classes: 8
  batch_size: 32
  num_epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.05

  # Engine-compatible optimizer config (dict format)
  optimizer:
    name: adamw
    lr: 0.0001
    weight_decay: 0.05

  # Engine-compatible scheduler config (dict format)
  scheduler:
    name: cosine

  # Engine-compatible loss config (dict format)
  loss:
    name: cross_entropy

evaluation:
  batch_size: 64
  metrics:
    - accuracy
    - f1
    - recall
    - precision

logging:
  level: INFO
  save_checkpoints: true
  checkpoint_interval: 10

# Engine-compatible dataset section
dataset:
  name: wafer_defects
  image_size: 224
  num_classes: 8
