# CTM-YOLOv10 experiment configuration

model:
  name: ctm_yolov10
  task: detection

  backbone:
    name: yolov10n
    pretrained: false

  ctm:
    enabled: true
    embed_dim: 256
    num_heads: 4
    mlp_ratio: 4.0
    dropout: 0.1

  input:
    image_size: 640
    channels: 3

data:
  dataset: wafer_defects
  image_size: 640
  num_classes: 8
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1

training:
  num_classes: 8
  batch_size: 16
  num_epochs: 300
  learning_rate: 0.001
  weight_decay: 0.0005
  optimizer: sgd
  scheduler: multistep

evaluation:
  batch_size: 32
  metrics:
    - map
    - map50
    - map75
    - precision
    - recall

logging:
  level: INFO
  save_checkpoints: true
  checkpoint_interval: 10
