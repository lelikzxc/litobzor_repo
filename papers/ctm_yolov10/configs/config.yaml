# CTM-IYOLOv10 experiment configuration for Magnetic Tile dataset
# Based on: "Wafer Defect Detection Technology Based on CTM-IYOLOv10 Network"

model:
  name: ctm_iyolov10
  task: detection
  num_classes: 3                  # Magnetic tile: Blowhole, Crack, Fray

  backbone:
    name: yolov10n
    pretrained: true

  # GhostConv: lightweight convolution replacing Conv in backbone stages 1-2
  ghost_conv:
    enabled: true

  # BiFPN: weighted bidirectional feature pyramid replacing PAN-FPN in neck
  bifpn:
    enabled: true
    channels: 256
    num_levels: 3
    num_repeats: 2

  # CTM (Clustering-Template Matching): preprocessing for die segmentation
  # Applied externally before model inference (not a network layer)
  ctm:
    enabled: true
    threshold: 0.7
    damping: 0.5

  input:
    image_size: 640
    channels: 3

training:
  num_classes: 3
  batch_size: 16
  num_epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0005

# Top-level fields for Builder compatibility
optimizer:
  name: sgd
  lr: 0.001
  weight_decay: 0.0005
  kwargs:
    momentum: 0.937
    nesterov: true

scheduler:
  name: cosine
  kwargs:
    T_max: 100
    eta_min: 0.00001

loss:
  name: cross_entropy

metrics:
  - accuracy
  - precision
  - recall

evaluation:
  batch_size: 32

data:
  data_root: datasets/magnetic_tile
  image_size: 640
  num_classes: 3
