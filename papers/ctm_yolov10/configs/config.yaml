# CTM-YOLOv10 experiment configuration for Magnetic Tile dataset

model:
  name: ctm_yolov10
  task: detection
  num_classes: 3                  # Magnetic tile: Blowhole, Crack, Fray

  backbone:
    name: yolov10n
    pretrained: true

  ctm:
    enabled: true
    embed_dim: 256
    num_heads: 4
    mlp_ratio: 4.0
    dropout: 0.1

  input:
    image_size: 640
    channels: 3

training:
  num_classes: 3
  batch_size: 16
  num_epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0005

# Top-level fields for Builder compatibility
optimizer:
  name: sgd
  lr: 0.001
  weight_decay: 0.0005
  kwargs:
    momentum: 0.937
    nesterov: true

scheduler:
  name: cosine
  kwargs:
    T_max: 100
    eta_min: 0.00001

loss:
  name: cross_entropy

metrics:
  - accuracy
  - precision
  - recall

evaluation:
  batch_size: 32

data:
  data_root: datasets/magnetic_tile
  image_size: 640
  num_classes: 1
