# SegFormer + Atrous experiment configuration for WM-811K segmentation
# Binary segmentation: background (0) and defect (1)
# Compatible with both SegFormer.from_config() and common.engine.EngineConfig.

model:
  name: segformer_atrous
  num_classes: 2
  task: segmentation

  encoder:
    name: hybrid_encoder     # Hybrid conv + transformer encoder
    variant: B0              # B0 (smallest) or B1
    qkv_bias: false
    qk_scale: null

  decoder:
    name: mlp_decoder        # lightweight all-MLP decoder with Post-fusion Block
    decoder_dim: 256         # common projection dimension
    dropout: 0.0

  input:
    image_size: 512
    channels: 3

data:
  dataset: wm811k_seg
  data_root: datasets/wm811k_seg
  image_size: 512
  num_classes: 2
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1

training:
  batch_size: 10
  num_epochs: 100
  learning_rate: 0.00006
  weight_decay: 0.01
  device: cuda
  amp: true

# Engine-compatible optimizer config (top-level, as expected by Builder)
optimizer:
  name: adamw
  lr: 0.00006
  weight_decay: 0.01

# Engine-compatible scheduler config (top-level, as expected by Builder)
scheduler:
  name: cosine
  kwargs:
    T_max: 100

# Engine-compatible loss config (top-level, as expected by Builder)
loss:
  name: focal

# Engine-compatible metrics list (top-level, as expected by Builder)
metrics:
  - iou
  - dice
  - pixel_accuracy
  - f1

evaluation:
  batch_size: 10
  metrics:
    - iou
    - dice
    - pixel_accuracy
    - f1

logging:
  level: INFO
  save_checkpoints: true
  checkpoint_interval: 10

checkpoint:
  save_dir: checkpoints/transformer_segmentation_wm811k
  metric_name: val_loss
  mode: min

# Engine-compatible dataset section
dataset:
  name: wm811k_seg
  image_size: 512
  num_classes: 2
