# SegFormer + Atrous experiment configuration

model:
  name: segformer_atrous
  task: segmentation
  # architecture params will be added during implementation

data:
  dataset: wafer_defects
  image_size: 512
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1

training:
  batch_size: 8
  num_epochs: 150
  learning_rate: 0.00006
  weight_decay: 0.01
  optimizer: adamw
  scheduler: poly

evaluation:
  batch_size: 16
  metrics:
    - iou
    - dice
    - pixel_accuracy
    - f1

logging:
  level: INFO
  save_checkpoints: true
  checkpoint_interval: 10
