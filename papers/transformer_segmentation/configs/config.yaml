# SegFormer + Atrous experiment configuration
# Compatible with both SegFormer.from_config() and common.engine.EngineConfig.

model:
  name: segformer_atrous
  num_classes: 8
  task: segmentation

  backbone:
    name: mix_transformer  # MiT-B0 / MiT-B1 / MiT-B2 / MiT-B3 / MiT-B4 / MiT-B5
    variant: B0            # B0 (smallest) through B5 (largest)
    qkv_bias: false
    qk_scale: null

  decoder:
    name: mlp_decoder      # lightweight all-MLP decoder
    decoder_dim: 256       # common projection dimension
    dropout: 0.0

  atrous:
    enabled: true
    rates: [1, 6, 12, 18]  # dilation rates for atrous conv
    reduction: 4            # channel reduction ratio

  input:
    image_size: 512
    channels: 3

data:
  dataset: wafer_defects
  image_size: 512
  num_classes: 8
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1

training:
  batch_size: 8
  num_epochs: 150
  learning_rate: 0.00006
  weight_decay: 0.01

  # Engine-compatible optimizer config (dict format)
  optimizer:
    name: adamw
    lr: 0.00006
    weight_decay: 0.01

  # Engine-compatible scheduler config (dict format)
  scheduler:
    name: poly

  # Engine-compatible loss config (dict format)
  loss:
    name: cross_entropy

evaluation:
  batch_size: 16
  metrics:
    - iou
    - dice
    - pixel_accuracy
    - f1

logging:
  level: INFO
  save_checkpoints: true
  checkpoint_interval: 10

# Engine-compatible dataset section
dataset:
  name: wafer_defects
  image_size: 512
  num_classes: 8
