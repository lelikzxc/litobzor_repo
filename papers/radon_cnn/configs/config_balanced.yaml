# Balanced small-data interpretation, NOT a recovered author split.
model:
  name: radon_cnn
  mode: classification
  num_classes: 7
  in_channels: 1
  radon_theta: 64
training:
  num_epochs: 500
  batch_size: 64
  learning_rate: 0.0003
  weight_decay: 0.0
  lr_decay: 0.99
  early_stopping_patience: 30
  grad_max_norm: null
  seed: 42
  amp: false
  cpu_threads: 2
checkpoint:
  save_dir: checkpoints/radon_cnn_balanced_seed42
  metric_name: val_loss
  mode: min
evaluation:
  batch_size: 64
data:
  data_root: datasets/wm811k
  image_size: 64
  protocol: balanced
  train_size: 6400
  # Donut has only 555 original wafers; 6400 balanced unique train maps
  # are impossible. Duplicates below are restricted to the training pool.
  allow_train_replacement: true
  val_split: 0.1
  test_split: 0.1
  cache_radon: true
