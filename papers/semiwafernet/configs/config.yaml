# SemiWaferNet experiment configuration

model:
  name: semiwafernet
  task: semi_supervised_detection
  # architecture params will be added during implementation

data:
  dataset: wafer_defects
  image_size: 512
  labeled_ratio: 0.1
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1

training:
  batch_size: 16
  num_epochs: 200
  learning_rate: 0.0001
  weight_decay: 0.0001
  optimizer: adam
  scheduler: step
  pseudo_label_threshold: 0.9

evaluation:
  batch_size: 32
  metrics:
    - map
    - map50
    - f1
    - precision
    - recall

logging:
  level: INFO
  save_checkpoints: true
  checkpoint_interval: 10
