model:
  name: semiwafernet
  mode: classification           # "classification" (HybridCNN-ViT) or "segmentation" (ConvoFormer-UNet)
  num_classes: 9                 # WM-811K has 9 classes
  seg_classes: 1                 # Binary defect mask logits (paper Section 4.1)
  backbone:
    type: cnn
    in_channels: 1               # WM-811K is grayscale
    channels: [64, 128]          # HybridCNN-ViT: 64 → 128
    depths: [1, 1]
    norm: bn
    activation: relu
  transformer:
    embed_dim: 128               # D=128 (HybridCNN-ViT)
    num_heads: 8
    num_layers: 4                # L=4
    mlp_ratio: 2                 # FF=256 = 2*128
    dropout: 0.2
    dropout_cls: 0.5
  decoder:
    base_channels: 66            # ConvoFormer-UNet width → ~7.11M (Table 8)
    embed_dim: 160               # ConvoFormer bottleneck width
    mlp_ratio: 2
  input:
    in_channels: 1
    image_size: 32               # 32×32 classification / 64×64 segmentation

training:
  num_epochs: 50
  batch_size: 256
  learning_rate: 0.00005
  weight_decay: 0.0004
  grad_max_norm: 1.0

seg_training:
  num_epochs: 50
  batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.01

optimizer:
  name: adamw
  lr: 0.00005
  weight_decay: 0.0004

scheduler:
  name: cosine
  kwargs:
    T_max: 50
    eta_min: 0.000001

loss:
  name: cross_entropy

metrics:
  - accuracy
  - f1
  - precision
  - recall

checkpoint:
  save_dir: checkpoints/semiwafernet
  metric_name: val_f1
  mode: max

evaluation:
  batch_size: 64

data:
  data_root: datasets/wm811k
  image_size: 32
  seg_data_root: datasets/wm811k_seg
  seg_image_size: 64
  # Paper Section 4.1: official WM-811K Training/Test; val from Training (~10%)
  use_official_split: true
  val_from_train: 0.1
  # Legacy random split over all labeled samples (when use_official_split: false)
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  hybrid_sampling:
    enabled: true
    none_downsample_ratio: 0.30
  augmentation:
    enabled: true

semi_supervised:
  enabled: true                  # HybridCNN-ViT SSL (Stages 1–3) with unlabeled WM-811K
  stages: 3
  unlabeled_max_samples: 150000  # paper Section 4.1
  epochs_per_stage: [17, 17, 16] # sum to training.num_epochs (50)
  ema_decay: 0.999
  confidence_threshold: 0.94     # τ_base
  alpha: 0.08
  beta: 0.02
  entropy_threshold: 0.08        # ε_H
  mutual_information_threshold: 0.12  # ε_MI
  mc_passes: 20                  # M
  consistency_weight: 0.0        # paper uses supervised CE on pseudo-labels, not MSE consistency
