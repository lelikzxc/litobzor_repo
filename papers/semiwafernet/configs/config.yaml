# SemiWaferNet experiment configuration for WM-811K dataset

model:
  name: semiwafernet
  num_classes: 9               # WM-811K has 9 classes
  backbone:
    type: cnn
    in_channels: 3
    channels: [64, 128, 256, 512]
    depths: [2, 2, 6, 2]
    norm: bn
    activation: relu
  transformer:
    embed_dim: 256
    num_heads: 8
    num_layers: 4
    mlp_ratio: 4
    dropout: 0.1
  decoder:
    embed_dim: 256
  input:
    in_channels: 3
    image_size: 128            # WM-811K native resolution

training:
  num_epochs: 50
  batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.0001
  grad_max_norm: 1.0

# Top-level fields for Builder compatibility
optimizer:
  name: adamw
  lr: 0.0001
  weight_decay: 0.0001

scheduler:
  name: cosine
  kwargs:
    T_max: 50
    eta_min: 0.000001

loss:
  name: cross_entropy

metrics:
  - accuracy
  - f1
  - precision
  - recall

checkpoint:
  save_dir: checkpoints/semiwafernet
  metric_name: val_loss
  mode: min

evaluation:
  batch_size: 64

data:
  data_root: datasets/wm811k
  image_size: 128
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
