# CPU diagnostic: full classifier, 10% of labeled train/val/test, supervised only.
# Run with --data-fraction 0.1 --device cpu --no-ssl. Not a paper reproduction.
seed: 42
model:
  name: semiwafernet
  mode: classification
  num_classes: 9
  seg_classes: 1
  backbone:
    type: cnn
    in_channels: 3
    channels:
    - 64
    - 128
    depths:
    - 1
    - 1
    norm: bn
    activation: relu
  transformer:
    embed_dim: 128
    num_heads: 8
    num_layers: 4
    mlp_ratio: 2
    dropout: 0.2
    dropout_cls: 0.5
  decoder:
    base_channels: 66
    embed_dim: 160
    mlp_ratio: 2
  input:
    in_channels: 3
    image_size: 32
training:
  num_epochs: 10
  batch_size: 256
  learning_rate: 5.0e-05
  weight_decay: 0.0004
  grad_max_norm: 1.0
seg_training:
  num_epochs: 50
  batch_size: 32
  learning_rate: 0.0001
  weight_decay: 0.01
optimizer:
  name: adamw
  lr: 5.0e-05
  weight_decay: 0.0004
scheduler:
  name: null
loss:
  name: cross_entropy
metrics:
- accuracy
- f1
- precision
- recall
checkpoint:
  save_dir: checkpoints/semiwafernet_cpu_diagnostic
  metric_name: val_f1
  mode: max
evaluation:
  batch_size: 64
data:
  data_root: datasets/wm811k
  image_size: 32
  seg_data_root: datasets/semiwafernet_seg
  seg_image_size: 64
  use_official_split: true
  val_from_train: 0.1
  pseudo_eval_fraction: 0.0
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  hybrid_sampling:
    enabled: true
    none_downsample_ratio: 0.3
  augmentation:
    enabled: true
  eval_prior_scale: 0.0
  ce_count_source: smote
  oversample_method: smote
semi_supervised:
  enabled: false
  stages: 3
  unlabeled_max_samples: 150000
  epochs_per_stage:
  - 17
  - 17
  - 16
  ema_decay: 0.999
  confidence_threshold: 0.94
  alpha: 0.08
  beta: 0.02
  entropy_threshold: 0.08
  mutual_information_threshold: 0.12
  mc_passes: 20
  ssl_prior_scale: 0.0
  calibrate_on_pseudo_eval: false
  max_none_to_defect_ratio: null
  consistency_weight: 0.0
