# Tiny Vision Transformer experiment configuration
# Implements ViT-Tiny as described in:
#   "Semiconductor Wafer Map Defect Classification with
#    Tiny Vision Transformers" (arXiv:2504.02494)
#
# Architecture per Table II:
#   - Layers: 12, Hidden: 192, Heads: 3, MLP: 768
#   - Patch size: 16, Image size: 64×64 (Section III-B: N=16 patches)
#   - Grayscale→RGB via 1×1 Conv (Section III-A.4)
#
# Trained on WM-811K dataset (9 classes)
# Compatible with both ViTTiny.from_config() and common.engine.EngineConfig.

model:
  name: vit_tiny
  num_classes: 9
  task: classification
  arch:
    image_size: 64
    patch_size: 16
    in_channels: 1
    num_classes: 9
    embed_dim: 192
    num_layers: 12
    num_heads: 3
    mlp_ratio: 4
    dropout: 0.1
    emb_dropout: 0.1

data:
  dataset: wafer_defects
  data_root: datasets/wm811k
  image_size: 64
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1

training:
  batch_size: 64
  num_epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.05
  device: cuda
  amp: true

# Engine-compatible optimizer config (top-level, as expected by Builder)
optimizer:
  name: adamw
  lr: 0.0001
  weight_decay: 0.05

# Engine-compatible scheduler config (top-level, as expected by Builder)
scheduler:
  name: cosine
  kwargs:
    T_max: 30

# Engine-compatible loss config (top-level, as expected by Builder)
loss:
  name: cross_entropy

# Engine-compatible metrics list (top-level, as expected by Builder)
metrics:
  - accuracy
  - f1
  - recall
  - precision

evaluation:
  batch_size: 128
  metrics:
    - accuracy
    - f1
    - recall
    - precision

logging:
  level: INFO
  save_checkpoints: true
  checkpoint_interval: 5

checkpoint:
  save_dir: checkpoints/vit_tiny_wm811k
  metric_name: val_loss
  mode: min

# Engine-compatible dataset section
dataset:
  name: wafer_defects
  image_size: 64
  num_classes: 9
