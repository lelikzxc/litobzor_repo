# Tiny Vision Transformer experiment configuration

model:
  name: vit_tiny
  task: classification
  arch:
    image_size: 32
    patch_size: 4
    in_channels: 1
    num_classes: 8
    embed_dim: 192
    num_layers: 4
    num_heads: 3
    mlp_ratio: 4
    dropout: 0.1
    emb_dropout: 0.1

data:
  dataset: wafer_defects
  image_size: 32
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1

training:
  batch_size: 32
  num_epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.05
  optimizer: adamw
  scheduler: cosine

evaluation:
  batch_size: 64
  metrics:
    - accuracy
    - f1
    - recall
    - precision

logging:
  level: INFO
  save_checkpoints: true
  checkpoint_interval: 10
