# Fast balanced TRAINING diagnostic; test remains independent and natural.
# This is not the manually curated/synthetic 2000-example paper dataset.
model:
  name: polar_cnn
  num_classes: 8
  input_adapter: nearest
training:
  num_epochs: 300
  batch_size: 256
  learning_rate: 0.01
  seed: 42
  num_workers: 0
  cpu_threads: 2
data:
  data_root: datasets/wm811k
  selection: all_maps
  reviewed_ids: null
  denoise_threshold: 3
  test_fraction: 0.30
  val_fraction_of_development: 0.10
  train_per_class: 175
checkpoint:
  save_dir: checkpoints/polar_cnn_small_seed42
