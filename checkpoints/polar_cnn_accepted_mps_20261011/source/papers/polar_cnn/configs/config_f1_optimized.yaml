# Experimental F1-oriented variant; not an exact paper reproduction.
# Selected on validation only; see results/f1_study_20261011.json.
model:
  name: polar_cnn
  num_classes: 8
  input_adapter: nearest
training:
  num_epochs: 300
  batch_size: 256
  learning_rate: 0.001
  seed: 42
  num_workers: 0
  cpu_threads: 2
  selection_metric: f1
  balanced_sampling: true
data:
  data_root: datasets/wm811k
  selection: all_maps
  reviewed_ids: null
  denoise_threshold: 3
  test_fraction: 0.3
  val_fraction_of_development: 0.2
  train_per_class: null
  map_resolution: native_scaled
  denoise_order: before_resize
  train_min_per_class: 1500
checkpoint:
  save_dir: checkpoints/polar_cnn_f1_optimized_seed42
