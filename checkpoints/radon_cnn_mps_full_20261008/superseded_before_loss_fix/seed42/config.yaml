model:
  name: radon_cnn
  mode: classification
  num_classes: 7
  in_channels: 1
  radon_theta: 64
training:
  num_epochs: 500
  batch_size: 64
  learning_rate: 0.0003
  weight_decay: 0.0
  lr_decay: 0.99
